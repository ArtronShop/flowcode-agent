[package]
name = "flowcode-agent"
version = "2.0.0"
edition = "2021"

[[bin]]
name = "flowcode-agent"
path = "src/main.rs"

[dependencies]
tokio       = { version = "1",    features = ["full"] }
axum        = { version = "0.8",  features = ["ws", "macros"] }
tower-http  = { version = "0.6",  features = ["cors"] }
serde       = { version = "1",    features = ["derive"] }
serde_json  = "1"
serialport  = "4"
tray-icon   = "0.19"
winit       = "0.30"
dirs        = "5"
futures-util = "0.3"
image       = { version = "0.25", default-features = false, features = ["png"] }

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 3
lto       = true
strip     = true
